# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"            # folder containing your .sln / Directory.Packages.props
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      silk-net:
        patterns: ["Silk.NET*"]
      test-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
    ignore:
      # Silk.NET 3.0 is a rewrite; migrate on purpose, not via a bot PR (ADR 0002)
      - dependency-name: "Silk.NET*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
