name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore WoadEngine/WoadEngine.slnx
      - run: dotnet build WoadEngine/WoadEngine.slnx -c Release --no-restore
      - run: dotnet test WoadEngine/WoadEngine.slnx -c Release --no-build